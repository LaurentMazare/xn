on: [push, pull_request]

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        shell: bash
        # Remove the target-arch=native as it breaks some dependencies.
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        shell: bash
        # Remove the target-arch=native as it breaks some dependencies.
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test

  # Generic aarch64 Linux, with no target-cpu, is the only job that builds the NEON fallbacks
  # used when dotprod is off.
  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    env:
      # xn-gemm's f16 kernels need fp16, which generic aarch64 Linux does not assume.
      RUSTFLAGS: -C target-feature=+fp16
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: cargo test -p xn

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        shell: bash
        # Remove the target-arch=native as it breaks some dependencies.
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings

  wasm-test:
    # The simd128 kernels only compile for wasm32; run their tests under wasmtime, which
    # executes wasm32-wasip1 binaries with SIMD and relaxed SIMD. `simd` selects the
    # simd128 modules and the target-neutral `simd_math`.
    name: Wasm SIMD tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test the simd128 modules
        env:
          RUSTFLAGS: -C target-feature=+simd128,+relaxed-simd
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test -p xn --lib --target wasm32-wasip1 -- simd
