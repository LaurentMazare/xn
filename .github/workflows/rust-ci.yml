on: [push, pull_request]

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        shell: bash
        # Remove the target-arch=native as it breaks some dependencies.
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
      # Builds the KleidiAI kernels on the arm64 macOS runner, and nothing on x86.
      - name: Fetch KleidiAI
        run: git submodule update --init --depth 1 xn-core/third_party/kleidiai
      - name: Check the kai feature
        run: cargo check -p xn --features kai

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        shell: bash
        # Remove the target-arch=native as it breaks some dependencies.
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
      # The macOS runners are arm64, so this builds the KleidiAI kernels. They have no SME2,
      # so the kernels themselves do not run here, only the fallback.
      - name: Fetch KleidiAI
        if: matrix.os == 'macOS-latest'
        run: git submodule update --init --depth 1 xn-core/third_party/kleidiai
      - name: Test the kai feature
        if: matrix.os == 'macOS-latest'
        run: cargo test -p xn --features kai
      - name: Lint the kai feature
        if: matrix.os == 'macOS-latest' && matrix.rust == 'stable'
        run: |
          rustup component add clippy
          cargo clippy -p xn --features kai --all-targets -- -D warnings

  # Generic aarch64 Linux, with no target-cpu, is the only job that builds the NEON fallbacks
  # used when dotprod is off.
  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    env:
      # xn-gemm's f16 kernels need fp16, which generic aarch64 Linux does not assume.
      RUSTFLAGS: -C target-feature=+fp16
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: cargo test -p xn
      # The kai feature with gcc and its Linux SME2 check. The runner has no SME2, so the
      # kernels themselves do not run.
      - run: git submodule update --init --depth 1 xn-core/third_party/kleidiai
      # The crate must carry the kernels it compiles: see `exclude` in xn-core/Cargo.toml.
      - run: cargo package -p xn --list | grep -qx third_party/kleidiai/kai/kai_common.h
      - run: cargo test -p xn --features kai
      - run: rustup component add clippy
      - run: cargo clippy -p xn --features kai --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        shell: bash
        # Remove the target-arch=native as it breaks some dependencies.
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings

  wasm-test:
    # The simd128 kernels only compile for wasm32; run their tests under wasmtime, which
    # executes wasm32-wasip1 binaries with SIMD and relaxed SIMD. `simd` selects the
    # simd128 modules and the target-neutral `simd_math`.
    name: Wasm SIMD tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Remove local cargo config
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test the simd128 modules
        env:
          RUSTFLAGS: -C target-feature=+simd128,+relaxed-simd
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test -p xn --lib --target wasm32-wasip1 -- simd
