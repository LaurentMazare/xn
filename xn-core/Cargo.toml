[package]
name = "xn"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
# Only the KleidiAI files that `build.rs` compiles, and its license, go into the package.
exclude = [
    "third_party/kleidiai/**",
    "!third_party/kleidiai/LICENSES/Apache-2.0.txt",
    "!third_party/kleidiai/kai/kai_common.h",
    "!third_party/kleidiai/kai/kai_common_sme_asm.S",
    "!third_party/kleidiai/kai/ukernels/matmul/pack/kai_lhs_quant_pack_qai8dxp_f32.[ch]",
    "!third_party/kleidiai/kai/ukernels/matmul/pack/kai_rhs_pack_nxk_qsi8cxp_qsi8cx_neon.[ch]",
    "!third_party/kleidiai/kai/ukernels/matmul/matmul_clamp_f32_qai8dxp_qsi8cxp/kai_matmul_clamp_f32_qai8dxp1vlx4_qsi8cxp4vlx4_1vlx4vl_sme2_mopa*",
    "!third_party/kleidiai/kai/ukernels/matmul/matmul_clamp_f32_qai8dxp_qsi8cxp/kai_matmul_clamp_f32_qai8dxp1x4_qsi8cxp4vlx4_1x4vl_sme2_dot*",
    "!third_party/kleidiai/kai/ukernels/matmul/matmul_clamp_f32_f32p_f32p/kai_matmul_clamp_f32_f32p2vlx1_f32p2vlx1biasf32_sme2_mopa*",
    "!third_party/kleidiai/kai/ukernels/matmul/pack/kai_lhs_pack_f32p2vlx1_f32_sme*",
    "!third_party/kleidiai/kai/ukernels/matmul/pack/kai_rhs_pack_kxn_f32p2vlx1biasf32_f32_f32_sme*",
    "!third_party/kleidiai/kai/ukernels/matmul/pack/kai_rhs_pack_nxk_f32p2vlx1biasf32_f32_f32_sme*",
]

[dependencies]
ash = { workspace = true, optional = true }
byteorder = { workspace = true }
cudarc = { workspace = true, optional = true }
gemm = { workspace = true }
half = { workspace = true }
kaudio = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
libm = { workspace = true }
memmap2 = { workspace = true }
metal = { workspace = true, optional = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
pollster = { workspace = true, optional = true }
rand = { workspace = true, features = ["thread_rng"] }
rand_distr = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true, optional = true }
yoke = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
paste = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }

# Example-only dev-deps. They pull in C/socket code that doesn't build on
# `wasm32-wasip1`, so gate them to non-wasm targets — tests don't use them.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
clap = { workspace = true }
hf-hub = { workspace = true }
tokenizers = { workspace = true }
tracing-chrome = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
bindgen_cuda = { workspace = true, optional = true }
cc = { workspace = true, optional = true }

[features]
default = []
accelerate = ["dep:libc"]
audio = ["dep:kaudio"]
cuda = ["dep:cudarc", "dep:bindgen_cuda"]
# Arm KleidiAI's SME2 kernels for `q8_0` weights on AArch64, see `quantized::kai`.
kai = ["dep:cc"]
metal = ["dep:metal"]
vulkan = ["dep:ash"]
webgpu = ["dep:wgpu", "dep:pollster"]

[[example]]
name = "mimi"
required-features = ["audio"]

[[example]]
name = "demucs"
required-features = ["audio"]

[[example]]
name = "basic_cuda"
required-features = ["cuda"]

[[example]]
name = "basic_vulkan"
required-features = ["vulkan"]

[[example]]
name = "basic_metal"
required-features = ["metal"]

[[example]]
name = "basic_webgpu"
required-features = ["webgpu"]

[[example]]
name = "cuda_benchmarks"
required-features = ["cuda"]

[[example]]
name = "cuda_thread_test"
required-features = ["cuda"]
